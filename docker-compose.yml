version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: midas-postgres
    environment:
      POSTGRES_DB: midas_core
      POSTGRES_USER: midas_user
      POSTGRES_PASSWORD: midas_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - midas-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: midas-kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    networks:
      - midas-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: midas-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - midas-network

  midas-core:
    build: .
    container_name: midas-core-app
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://postgres:5432/midas_core
      DATABASE_USERNAME: midas_user
      DATABASE_PASSWORD: midas_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - kafka
    networks:
      - midas-network
    volumes:
      - ./logs:/var/log/midas-core

  prometheus:
    image: prom/prometheus:latest
    container_name: midas-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - midas-network

  grafana:
    image: grafana/grafana:latest
    container_name: midas-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - midas-network

volumes:
  postgres_data:
  grafana_data:

networks:
  midas-network:
    driver: bridge
